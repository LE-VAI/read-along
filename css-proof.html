<!DOCTYPE html><html><head><meta charset="utf-8">
<title>CSS delivery proof</title>
<!-- Deliberately NO read-along.css link, as a consumer following the README
     for an npm install would have (they must know to add it themselves). -->
<style>body{background:#0b0c0f;color:#f5f5f7;font:16px sans-serif;padding:40px}</style>
</head><body>
<read-along id="ra" rate="1">
  <p>One two three four five six seven.</p>
</read-along>
<script type="module">
import { WebSpeechEngine } from 'http://127.0.0.1:8795/src/engines/webspeech.js';
const el = document.getElementById('ra');
el.engine = new WebSpeechEngine({ rate: 1 });
el.play();
setTimeout(() => {
  const hl = CSS.highlights.get('read-along-word');
  window.__proof = {
    supported: typeof Highlight !== 'undefined',
    registryEntries: hl ? hl.size : 0,
    activeToken: el.activeToken,
    markInDom: document.querySelectorAll('mark').length,
    // The decisive question: is there any ::highlight() RULE in the document?
    styleSheets: [...document.styleSheets].map(s => s.href || 'inline').join(', '),
  };
}, 1500);
</script></body></html>
