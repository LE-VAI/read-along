name: CI

# read-along is published to npm; this is the gate that runs before anything
# reaches the registry. The package has zero runtime dependencies, so there is
# no install step — the suite uses node:test from the standard library.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Run the test suite
        run: npm test

      - name: Verify every module parses
        run: |
          for f in src/*.js src/engines/*.js; do
            node --check "$f" || exit 1
          done
          echo "all modules parse"

  engines:
    name: Engine contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Every engine loads without its optional peer dependency
        run: |
          # The core is engine-agnostic: each engine must be loadable WITHOUT
          # its optional peer dependency installed. kokoro.js is the test case
          # — it imports kokoro-js, which is NOT a dependency of this package,
          # so a missing peer dep must not break an import of any engine.
          #
          # These modules are DOM-free by design and must import in plain Node.
          # The component itself (src/read-along.js) is NOT in this list: it is
          # a custom element that builds its template at module load, so it
          # legitimately requires a document. Asserting otherwise would be
          # testing a claim the package does not make.
          node -e "
          const mods = [
            ['./src/tokenizer.js', ['tokenize', 'chunkTokens']],
            ['./src/timings.js', ['wordTimingsFromChunk']],
            ['./src/engines/webspeech.js', ['WebSpeechEngine']],
            ['./src/engines/media.js', ['MediaEngine']],
            ['./src/engines/external.js', ['ExternalEngine']],
          ];
          (async () => {
            for (const [path, names] of mods) {
              const m = await import(path);
              for (const n of names) {
                if (!(n in m)) throw new Error(path + ' is missing export ' + n);
              }
              console.log('ok', path);
            }
            console.log('engine contract holds');
          })().catch((e) => { console.error(e.message); process.exit(1); });
          "

      - name: The component requires a DOM (documented, not accidental)
        run: |
          # Guard the boundary from the other side: if read-along.js ever
          # STARTS importing in plain Node, that means the template moved out
          # of module scope and the component's load behaviour changed. Worth
          # knowing, either way.
          if node -e "import('./src/read-along.js')" 2>/dev/null; then
            echo 'NOTE: src/read-along.js now imports without a DOM.'
            echo 'That is a behaviour change — confirm it is intended.'
          else
            echo 'ok: src/read-along.js requires a document, as documented'
          fi
